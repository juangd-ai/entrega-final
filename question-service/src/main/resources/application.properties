server.port=8083
spring.application.name=question-service

# ---- Persistencia (H2 en memoria) ----
spring.datasource.url=jdbc:h2:mem:saberpro;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- RabbitMQ ----
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ---- Intercambiabilidad de adaptadores: jpa | memory ----
saberpro.persistence=memory

# ---- Servicio de validación (síncrono REST) ----
saberpro.validation.url=${VALIDATION_URL:http://localhost:8082}
